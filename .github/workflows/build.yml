name: Build & Release TypePHP Webman

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive_name: tinywan-typephp-webman-linux-x64.tar.gz
          - os: windows-latest
            platform: windows-x64
            archive_name: tinywan-typephp-webman-windows-x64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pcntl, posix, opcache, gmp, mbstring
          coverage: none
          tools: composer:v2

      # ---------------- Linux 构建环境准备与依赖安装 ----------------
      - name: Install Linux Build Dependencies (GMP, MPFR, PHP-Embed, CMake, GCC)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgmp-dev libmpfr-dev php8.4-dev libphp8.4-embed || true
          # 建立 libphp.so 软链接 (若为版本号命名)
          if [ -f "/usr/lib/libphp8.4.so" ] && [ ! -f "/usr/lib/libphp.so" ]; then
            sudo ln -sf /usr/lib/libphp8.4.so /usr/lib/libphp.so
          fi

      # ---------------- Windows 构建环境准备 ----------------
      - name: Setup MSVC Toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---------------- 安装 PHP 依赖 ----------------
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ---------------- Linux 编译与打包 ----------------
      - name: Build and Package on Linux
        if: runner.os == 'Linux'
        run: |
          echo "[CI] Step 1: Locate libphp.so"
          PHP_PREFIX=$(php-config --prefix)
          echo "PHP_PREFIX=$PHP_PREFIX"

          # 寻找并软链接 libphp.so 到 PHP 库目录
          sudo mkdir -p "$PHP_PREFIX/lib"
          for f in /usr/lib/libphp*.so /usr/lib/x86_64-linux-gnu/libphp*.so; do
            if [ -f "$f" ]; then
              echo "Found $f, copying/linking to $PHP_PREFIX/lib/libphp.so and /usr/lib/libphp.so"
              sudo cp -f "$f" "$PHP_PREFIX/lib/libphp.so"
              sudo ln -sf "$f" /usr/lib/libphp.so || true
              break
            fi
          done

          echo "[CI] Step 2: Build swoole/phpx"
          PHPX_DIR="$GITHUB_WORKSPACE/vendor/swoole/phpx"
          cd "$PHPX_DIR"
          cmake . -Dphp_dir="$PHP_PREFIX"
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          cd "$GITHUB_WORKSPACE"

          echo "[CI] Step 3: Run package.sh"
          chmod +x package.sh start.sh
          export PHP_HOME="$PHP_PREFIX"
          export PHPX_HOME="$PHPX_DIR"
          ./package.sh
          tar -czvf ${{ matrix.archive_name }} -C dist .

      # ---------------- Windows 编译与打包 ----------------
      - name: Build and Package on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call package.bat
          powershell Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }}

      # ---------------- 上传构建产物 (Artifacts) ----------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      # ---------------- 发布 GitHub Release ----------------
      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
