name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact TypePHP version from composer.lock (for example v0.8.1)'
        required: true
        type: string
      push:
        description: 'Push images to Docker Hub'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  docker:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dynamic
            image: tinywan/typephp-linux-x64
            dockerfile: Dockerfile.linux-dynamic
          - variant: static
            image: tinywan/typephp-linux-x64-static
            dockerfile: Dockerfile.linux-static
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and verify TypePHP version
        id: version
        shell: bash
        run: |
          mapfile -t locked_versions < <(jq -r '."packages-dev"[] | select(.name == "swoole/typephp") | .version' composer.lock)
          if [[ "${#locked_versions[@]}" -ne 1 || -z "${locked_versions[0]}" || "${locked_versions[0]}" == "null" ]]; then
            echo 'Expected exactly one swoole/typephp entry in composer.lock packages-dev.' >&2
            exit 1
          fi

          locked_version="${locked_versions[0]}"
          locked_tag="v${locked_version#v}"
          requested_version="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          [[ "$locked_tag" =~ $version_pattern ]] || { echo "Invalid locked TypePHP version: $locked_version" >&2; exit 1; }
          [[ "$requested_version" =~ $version_pattern ]] || { echo "Invalid requested version: $requested_version" >&2; exit 1; }
          [[ "$requested_version" == "$locked_tag" ]] || { echo "Requested version $requested_version does not match locked TypePHP version $locked_tag." >&2; exit 1; }

          echo "tag=$locked_tag" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' || inputs.push }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: steps.version.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.version.outputs.push }}
          build-args: |
            TYPEPHP_VERSION=${{ steps.version.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-publish-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-publish-${{ matrix.variant }}
          provenance: mode=max
          sbom: true
