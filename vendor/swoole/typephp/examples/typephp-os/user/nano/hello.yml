name: typephp_os_user_hello
mode: bin
sources:
  - hello.php
build-dir: ../../build/generated-user-hello
output: ../../build/tnhello.elf
cxx-std: c++17
include-paths:
  - ../../kernel/core/abi
  - ../../thirdparty/openlibm/include
  - ../../thirdparty/openlibm/src
  - ../../thirdparty/openlibm/amd64
defines:
  - TYPEPHP_NO_MAIN=1
  - PHPX_NO_EXCEPTION=1
  - PHPX_NO_RTTI=1
  - PHP_NANO_NO_LIBC=1
  - HAVE_SYS_UTSNAME_H=1
  - HAVE_SYS_SOCKET_H=1
  - HAVE_NETINET_IN_H=1
  - HAVE_SHUTDOWN=1
  - __NO_CTYPE=1
  - ZEND_MM_ERROR=0
  - ZEND_MM_CUSTOM=0
  - ASSEMBLER=1
  - __BSD_VISIBLE=1
cxx-flags:
  - -O2
  - -U_FORTIFY_SOURCE
  - -D_FORTIFY_SOURCE=0
  - -ffreestanding
  - -fno-builtin
  - -fno-stack-protector
  - -fno-pic
  - -fno-pie
  - -m64
  - -mno-red-zone
  - -mcmodel=small
  - -fno-rtti
  - -fno-threadsafe-statics
c-flags:
  - -O2
  - -U_FORTIFY_SOURCE
  - -D_FORTIFY_SOURCE=0
  - -ffreestanding
  - -fno-builtin
  - -fno-stack-protector
  - -fno-pic
  - -fno-pie
  - -m64
  - -mno-red-zone
  - -mcmodel=small
asm-flags:
  - -m64
  - -mno-red-zone
  - -mcmodel=small
ld-flags:
  - -nostdlib
  - -no-pie
  - -Wl,-m,elf_x86_64
  - -Wl,--build-id=none
  - -Wl,-T,user/runtime/linker.ld
  - -Wl,--defsym,USER_BASE=0x41000000
link-paths:
  - ../../build
link-libs:
  - typephp-os
  - compiler-rt-builtins
