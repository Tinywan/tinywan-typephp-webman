name: typephp_os_user_https
mode: bin
sources:
  - https.php
build-dir: ../../build/generated-user-https
output: ../../build/https.elf
cxx-std: c++17
include-paths:
  - ../../kernel/core/abi
  - ../../thirdparty/openlibm/include
  - ../../thirdparty/openlibm/src
  - ../../thirdparty/openlibm/amd64
  - ../../build/network-thirdparty/install/include
defines:
  - _DEFAULT_SOURCE=1
  - HAVE_REALLOCARRAY=1
  - HAVE_SYS_SOCKET_H=1
  - HAVE_NETINET_IN_H=1
  - HAVE_POLL=1
  - HAVE_POLL_H=1
  - HAVE_GETADDRINFO=1
  - HAVE_GAI_STRERROR=1
  - HAVE_INET_PTON=1
  - HAVE_SHUTDOWN=1
  - HAVE_STRUCT_TM_TM_GMTOFF=1
  - TYPEPHP_NO_MAIN=1
  - PHPX_NO_EXCEPTION=1
  - PHPX_NO_RTTI=1
  - PHP_NANO_NO_LIBC=1
  - HAVE_SYS_UTSNAME_H=1
  - HAVE_SYS_TYPES_H=1
  - HAVE_SYS_TIME_H=1
  - HAVE_UNISTD_H=1
  - HAVE_TLS12=1
  - HAVE_TLS13=1
  - HAVE_TLS_ALPN=1
  - HAVE_TLS_SNI=1
  - CURL_STATICLIB=1
  - __NO_CTYPE=1
  - ZEND_MM_ERROR=0
  - ZEND_MM_CUSTOM=0
  - ASSEMBLER=1
  - __BSD_VISIBLE=1
cxx-flags:
  - -O2
  - -U_FORTIFY_SOURCE
  - -D_FORTIFY_SOURCE=0
  - -ffreestanding
  - -fno-builtin
  - -fno-stack-protector
  - -fno-pic
  - -fno-pie
  - -m64
  - -mno-red-zone
  - -mcmodel=small
  - -fno-rtti
  - -fno-threadsafe-statics
c-flags:
  - -O2
  - -U_FORTIFY_SOURCE
  - -D_FORTIFY_SOURCE=0
  - -ffreestanding
  - -fno-builtin
  - -fno-stack-protector
  - -fno-pic
  - -fno-pie
  - -m64
  - -mno-red-zone
  - -mcmodel=small
asm-flags:
  - -m64
  - -mno-red-zone
  - -mcmodel=small
ld-flags:
  - -nostdlib
  - -no-pie
  - -Wl,-m,elf_x86_64
  - -Wl,--build-id=none
  - -Wl,-T,user/runtime/linker.ld
  - -Wl,--defsym,USER_BASE=0x41000000
link-paths:
  - ../../build/network-thirdparty/install/lib
  - ../../build
link-libs:
  - curl
  - nghttp2
  - ssl
  - crypto
  - ssl
  - crypto
  - typephp-os
  - compiler-rt-builtins
